name: BLOPSPocket
options:
  bundleIdPrefix: com.adriantomasdiez
  deploymentTarget:
    iOS: "15.0"
targets:
  BLOPSPocket:
    type: application
    platform: iOS
    sources:
      - BLOPSPocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adriantomasdiez.blopspocket
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/libs"
          - "$(SRCROOT)/../engine_build/build/Build/Products/Release-iphoneos"
          - "$(SRCROOT)/../engine_build/Release-iphoneos"
        OTHER_LDFLAGS:
          - "-L$(SRCROOT)/libs"
    info:
      path: BLOPSPocket/Info.plist
      properties:
        CFBundleDisplayName: BLOPS pocket
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Deja ver la carpeta de la app en Archivos → En mi iPhone → BLOPS pocket,
        # que es la vía recomendada para copiar el juego (reglas.md, sección 10).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
