name: iOS IPA (unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: app
        run: |
          xcodebuild \
            -project BLOPSPocket.xcodeproj \
            -scheme BLOPSPocket \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R app/build/Build/Products/Release-iphoneos/BLOPSPocket.app Payload/
          zip -r BLOPSPocket-${{ github.run_number }}.ipa Payload
          mv BLOPSPocket-${{ github.run_number }}.ipa $GITHUB_WORKSPACE/
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLOPSPocket-unsigned
          path: app/build/Build/Products/Release-iphoneos/BLOPSPocket.ipa

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BLOPSPocket-${{ github.run_number }}.ipa
          name: Build ${{ github.run_number }} - ${{ github.sha }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
