name: iOS Build & IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen || echo "xcodegen unavailable via brew"

      - name: Generate Xcode project
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen generate --spec app/project.yml --project app/
          else
            echo "::error::xcodegen is required to generate the Xcode project"
            exit 1
          fi

      - name: Build unsigned .app (iphoneos)
        run: |
          xcodebuild -project app/BLOPSPocket.xcodeproj \
                     -scheme BLOPSPocket \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build/DD \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_STYLE=Manual \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     build

      - name: Package .ipa (unsigned)
        run: |
          APP=$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "$APP" ]; then echo "::error::no .app produced"; exit 1; fi
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qr BLOPSPocket.ipa Payload
          rm -rf Payload
          ls -lh BLOPSPocket.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLOPSPocket-unsigned
          path: build/BLOPSPocket.ipa
          if-no-files-found: error
