name: iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: app
        run: |
          xcodebuild \
            -project BLOPSPocket.xcodeproj \
            -scheme BLOPSPocket \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R app/build/Build/Products/Release-iphoneos/BLOPSPocket.app Payload/
          zip -r BLOPSPocket.ipa Payload
          rm -rf Payload

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLOPSPocket-${{ github.run_number }}
          path: BLOPSPocket.ipa

      # One single, always-newest release: same tag, same asset name.
      # Download URL never changes:
      #   https://github.com/AdrianTomasDiez/BLOPS-pocket/releases/download/latest-ipa/BLOPSPocket.ipa
      - name: Remove previous IPA release
        run: gh release delete latest-ipa --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish IPA release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-ipa
          name: LAST IPA - build ${{ github.run_number }}
          body: |
            Unsigned IPA, install with AltStore / SideStore / Sideloadly.

            Built from commit ${{ github.sha }} on ${{ github.event.repository.updated_at }}.

            **This release is always overwritten with the newest build.**
          files: BLOPSPocket.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
