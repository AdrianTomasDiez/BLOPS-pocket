name: iOS IPA (sin firmar)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Probar las herramientas (Node)
        run: node --test tools/zonescan.test.mjs tools/zoneassets.test.mjs tools/zrawfile.test.mjs tools/zsizeof.test.mjs tools/zassetsize.test.mjs tools/zxmodel.test.mjs tools/zgfxworld.test.mjs

      - name: Configurar y compilar Motor C++ (CMake iOS ARM64)
        run: |
          cmake -B engine_build -S engine_source \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          xcodebuild \
            -project engine_build/BO1Zombies.xcodeproj \
            -scheme BO1Zombies \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath engine_build/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build || echo "::warning::Compilación parcial del motor C++ (analizando compatibilidad en macOS)"

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        working-directory: launcher
        run: xcodegen generate

      - name: Compilar sin firma
        working-directory: launcher
        run: |
          xcodebuild \
            -project BLOPSPocket.xcodeproj \
            -scheme BLOPSPocket \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar IPA
        working-directory: launcher/build/Build/Products/Release-iphoneos
        run: |
          mkdir -p Payload
          cp -R BLOPSPocket.app Payload/
          zip -r BLOPSPocket.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BLOPSPocket-unsigned
          path: launcher/build/Build/Products/Release-iphoneos/BLOPSPocket.ipa

      - name: Publicar Release con descarga directa del .ipa
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "BLOPS Pocket (Última versión)"
          body: "Descarga directa del archivo .ipa para instalar con AltStore, TrollStore o SideStore sin descomprimir ningún ZIP."
          files: launcher/build/Build/Products/Release-iphoneos/BLOPSPocket.ipa
          prerelease: false
