name: Engine

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S engine -B engine/build -G Ninja
      - name: Build
        run: ninja -C engine/build
      - name: Test
        run: ctest --test-dir engine/build --output-on-failure
